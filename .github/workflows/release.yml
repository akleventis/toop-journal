name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          bun install
          npm --prefix renderer ci

      - name: Build & Package
        run: npm run build

      - name: Find build output
        run: find . -name "*.app" -maxdepth 6 2>/dev/null || echo "no .app found"; ls -la

      - name: Zip app bundle
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          APP_PATH=$(find build -name "*.app" -maxdepth 3 | head -1)
          echo "Found app at: $APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "Book-of-Toop-${REF_NAME}.zip"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Book-of-Toop-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
