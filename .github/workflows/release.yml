name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # node + bun versions come from mise.toml, same as local
      - uses: jdx/mise-action@v5
      - run: bun install && npm --prefix renderer ci
      - run: npm run package
      - name: Release DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv artifacts/*.dmg "Book-of-Toop-$GITHUB_REF_NAME.dmg"
          gh release create "$GITHUB_REF_NAME" "Book-of-Toop-$GITHUB_REF_NAME.dmg" --generate-notes
