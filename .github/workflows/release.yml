name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # node + bun versions come from mise.toml, same as local
      - uses: jdx/mise-action@v5
      - run: bun install && npm --prefix renderer ci
      - run: npm run package
      - name: Release DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv artifacts/*.dmg "Book-of-Toop-$GITHUB_REF_NAME.dmg"
          # solo repo; drop the "by @author" from each generated line
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body \
            | sed -E 's/ by @[A-Za-z0-9-]+ in / in /' > notes.md
          gh release create "$GITHUB_REF_NAME" "Book-of-Toop-$GITHUB_REF_NAME.dmg" --notes-file notes.md
