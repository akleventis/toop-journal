name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Clone electrobun fork
        run: |
          git clone https://github.com/akleventis/electrobun.git ${{ github.workspace }}/../electrobun
          git -C ${{ github.workspace }}/../electrobun checkout 2dc06b38d829d89c884f88ac8c64c517698bf37c

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build electrobun fork
        run: |
          bun install --cwd ${{ github.workspace }}/../electrobun/package
          bun run --cwd ${{ github.workspace }}/../electrobun/package build:release

      - name: Install dependencies
        run: |
          bun install
          npm --prefix renderer ci

      - name: Build & Package
        run: npm run package

      - name: Find and upload DMG
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          DMG_PATH=$(find artifacts -name "*.dmg" -maxdepth 3 | head -1)
          echo "Found DMG at: $DMG_PATH"
          mv "$DMG_PATH" "Book-of-Toop-${REF_NAME}.dmg"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Book-of-Toop-${{ github.ref_name }}.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
